<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<!-- 关键：请求视频时不带 Referer，绕过 cjyun CDN 的防盗链 -->
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>钟祥新闻 · TV点播</title>
<style>
  * { outline:none; -webkit-tap-highlight-color:transparent; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; background:#0b0f14; color:#e8eaed;
              font-family:"Microsoft YaHei","PingFang SC","Source Han Sans SC",sans-serif;
              overflow:hidden; user-select:none; }

  /* ===== 列表页：纯文字节目单 ===== */
  #listView { display:flex; flex-direction:column; width:100%; height:100%; padding:20px 36px 12px; }
  .header { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;
            padding-bottom:10px; border-bottom:2px solid #1d2530; }
  .header h1 { font-size:26px; font-weight:700; color:#fff; letter-spacing:2px; }
  .header h1 .bar { display:inline-block; width:6px; height:26px; background:#e53935;
                    vertical-align:-5px; margin-right:12px; border-radius:2px; }
  .header .meta { font-size:16px; color:#8a93a0; }
  .header .meta b { color:#ff5252; font-weight:600; }

  #list { flex:1; overflow:hidden; display:flex; flex-direction:column; position:relative; }

  .row { display:flex; align-items:center; padding:0 14px; height:44px; margin-bottom:2px;
         border-left:4px solid transparent; border-radius:4px; cursor:pointer; }
  .row .no { width:42px; font-size:16px; color:#5a6370; font-weight:600; }
  .row .title { flex:1; font-size:18px; color:#d0d5dc; white-space:nowrap; overflow:hidden;
                text-overflow:ellipsis; }
  .row .dur { width:110px; text-align:right; font-size:15px; color:#7a8390; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .row .date { width:64px; text-align:right; font-size:15px; color:#5a6370; margin-left:10px; white-space:nowrap; }

  .row.focus { background:#1d2530; border-left-color:#ff5252; }
  .row.focus .title { color:#fff; }
  .row.focus .no { color:#ff5252; }
  .row.focus .dur { color:#ffb3b3; }

  /* 加载/错误 */
  #status { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
            font-size:36px; color:#8a93a0; background:#0b0f14; z-index:50; }

  /* ===== 播放页：纯全屏，无菜单 ===== */
  #playerView { position:fixed; top:0; left:0; width:100%; height:100%; background:#000; display:none; z-index:9999; }
  #playerView.on { display:block; }
  #video { position:absolute; top:0; left:0; width:100%; height:100%; background:#000; }

  /* 暂停/居中提示 */
  #centerTip { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
               font-size:140px; color:rgba(255,255,255,.85); pointer-events:none;
               text-shadow:0 4px 24px rgba(0,0,0,.6); display:none; }
</style>
</head>
<body>

<!-- 列表 -->
<div id="listView">
  <div class="header">
    <h1><span class="bar"></span>钟祥新闻 · 最新</h1>
    <div class="meta">共 <b id="totalNum">-</b> 期 · ↑↓选择 · OK播放 · 返回退出 · 更新于 <span id="updateTime">--:--</span></div>
  </div>
  <div id="list"></div>
</div>

<div id="status">加载中…</div>

<!-- 播放：纯全屏 -->
<div id="playerView">
  <video id="video" autoplay playsinline controls></video>
  <div id="centerTip">▶</div>
</div>

<script>
(function(){
  var API_BASE = "https://m-zhongxiang.cjyun.org/index/ajax/content?page=1&webmenuid=151&callback=";
  var CACHE_KEY = 'cjy_news_cache';
  // 首次安装兜底数据（2026-10-10抓取，联网成功后自动更新）
  var FALLBACK = [{"id":"153652","title":"钟祥新闻2026年10月8日","time":"2026-10-09 18:28:37","duration":"494","playtime":"08:14","video":"https://videoplus.cjyun.org/20261009/4032454_4032454_1791540861_transv.mp4","thumb":""},{"id":"153579","title":"钟祥新闻2026年10月7日","time":"2026-10-08 12:44:18","duration":"600","playtime":"10:00","video":"https://videoplus.cjyun.org/20261008/4031465_4031465_1791433115_transv.mp4","thumb":""},{"id":"153560","title":"钟祥新闻2026年10月6日","time":"2026-10-07 22:46:27","duration":"606","playtime":"10:06","video":"https://videoplus.cjyun.org/20261007/4031038_4031038_1791383875_transv.mp4","thumb":""},{"id":"153559","title":"钟祥新闻2026年10月5日","time":"2026-10-07 22:46:09","duration":"408","playtime":"06:48","video":"https://videoplus.cjyun.org/20261007/4031037_4031037_1791383875_transv.mp4","thumb":""},{"id":"153500","title":"钟祥新闻2026年10月2日","time":"2026-10-02 23:15:45","duration":"534","playtime":"08:54","video":"https://videoplus.cjyun.org/20261002/4029405_4029405_1790949924_transv.mp4","thumb":""},{"id":"153499","title":"钟祥新闻2026年10月1日","time":"2026-10-02 23:15:24","duration":"504","playtime":"08:24","video":"https://videoplus.cjyun.org/20261002/4029406_4029406_1790949924_transv.mp4","thumb":""},{"id":"153469","title":"钟祥新闻2026年9月30日","time":"2026-10-01 17:43:52","duration":"596","playtime":"09:56","video":"https://videoplus.cjyun.org/20260930/4028046_4028046_1790764981_transv.mp4","thumb":""},{"id":"153458","title":"钟祥新闻2026年9月29日","time":"2026-09-30 16:04:16","duration":"739","playtime":"12:19","video":"https://videoplus.cjyun.org/20260930/4027681_4027681_1790753799_transv.mp4","thumb":""},{"id":"153360","title":"钟祥新闻2026年9月28日","time":"2026-09-29 10:24:56","duration":"445","playtime":"07:25","video":"https://videoplus.cjyun.org/20260929/4026571_4026571_1790647587_transv.mp4","thumb":""},{"id":"153348","title":"钟祥新闻2026年9月25日","time":"2026-09-28 18:26:50","duration":"849","playtime":"14:09","video":"https://videoplus.cjyun.org/20260928/4026177_4026177_1790589863_transv.mp4","thumb":""}];

  var listEl = document.getElementById('list');
  var statusEl = document.getElementById('status');
  var totalNum = document.getElementById('totalNum');
  var list = [];
  var focusIdx = 0;
  var watching = false;
  var updated = false;
  var playIdx = 0;  // 记录播放时选中的列表索引
  // —— 列表焦点渲染性能优化：缓存行、只切前后两行、rAF合并（缓解手机投屏卡顿） ——
  var _rowEls = [];      // 缓存的 .row 引用，避免每次按键 querySelectorAll
  var _lastFocus = -1;   // 当前高亮行索引
  var _focusRaf = 0;     // requestAnimationFrame 句柄
  var _pendingFocus = -1;// 待应用的焦点索引（合并高频按键）

  function setStatus(msg){
    var t = document.getElementById('updateTime');
    if (t) t.textContent = msg;
  }

  // 先显示缓存，没有缓存用兜底数据
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); } catch(e){}

  if (cached && cached.length) {
    list = cached;  // 启动直接显示缓存，不清洗
    applyList(list);
    setStatus(fmtNow() + ' · 离线缓存');
  } else {
    list = FALLBACK.slice();
    applyList(list);
    setStatus('启动加载中...');
  }

  // 决定本次拉多少条：
  // - 缓存不足60条：直接拉满60，把历史记录补齐
  // - 缓存已满60：按缓存最新日期到今天的天数差+3缓冲，最少5条，封顶60
  function calcNeedCount(){
    if (!list.length || list.length < 60) return 60;
    var lastDate = (list[0].time||'').split(' ')[0];
    if (!lastDate) return 60;
    var last = new Date(lastDate + 'T00:00:00');
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    var daysDiff = Math.round((today - last) / 86400000);
    return Math.min(Math.max(daysDiff + 3, 5), 60);
  }

  // 合并、按id去重、按时间倒序排序，最多保留60条
  function mergeList(oldList, newList){
    var seen = {};
    var merged = [];
    (newList || []).concat(oldList || []).forEach(function(it){
      if (!it || !it.id) return;
      if (seen[it.id]) return;
      seen[it.id] = true;
      merged.push(it);
    });
    merged.sort(function(a,b){ return (b.time||'').localeCompare(a.time||''); });
    return merged.slice(0, 60);
  }

  // Java层注入数据（APK模式）
  window.applyListFromJSON = function(data){
    updated = true;
    var nl = data.data || [];
    if (!nl.length) return;
    var before = list.length;
    var beforeFirstId = list[0] && list[0].id;
    list = mergeList(list, nl);
    applyList(list);
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(list)); } catch(e){}
    var added = list.length > before ? list.length - before : 0;
    var isNew = list[0] && list[0].id !== beforeFirstId;
    setStatus(fmtNow() + (isNew ? (added ? ' · 新增' + added + '条' : ' · 已更新') : ' · 已是最新'));
  };
  // JSONP备用（浏览器模式）
  window.__cjyCallback = function(data){
    window.applyListFromJSON(data);
  };
  function loadAPI(){
    if (updated) return;
    var ps = calcNeedCount();
    var s = document.createElement('script');
    s.src = API_BASE + '__cjyCallback&pagesize=' + ps + '&_t=' + Date.now();
    document.head.appendChild(s);
  }
  // 启动时按缓存落后天数自动拉一次
  function autoFetch(){
    if (updated) return;
    var ps = calcNeedCount();
    if (window.AndroidBridge) {
      window.AndroidBridge.refresh(ps);
    } else {
      loadAPI();
    }
  }
  setTimeout(autoFetch, 1500);
  setTimeout(function(){ if (!updated) autoFetch(); }, 10000);
  setTimeout(function(){
    if (!updated) setStatus(fmtNow() + ' · 离线模式（选中上方刷新按钮重试）');
  }, 20000);

  function fmtNow(){
    var d = new Date();
    return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2);
  }

  function fmtTime(t){
    // "2026-10-09 18:28:37" → "18:28"
    var parts = (t||'').split(' ');
    return parts[1] ? parts[1].substring(0,5) : '';
  }
  function fmtDate(t){ return (t||'').split(' ')[0]; }

  function render(){
    listEl.innerHTML = '';
    var refreshRow = document.createElement('div');
    refreshRow.className = 'row';
    refreshRow.innerHTML =
      '<div class="no">↻</div>' +
      '<div class="title" style="color:#4fc3f7;font-weight:bold;">刷新列表</div>' +
      '<div class="dur"></div>' +
      '<div class="date"></div>';
    refreshRow.addEventListener('click', function(){ doRefresh(); });
    listEl.appendChild(refreshRow);
    list.forEach(function(it, i){
      var row = document.createElement('div');
      row.className = 'row';
      row.innerHTML =
        '<div class="no">'+(i<9 ? '0' : '')+(i+1)+'</div>' +
        '<div class="title">'+(i===0 ? '● ' : '')+(it.title||'')+'</div>' +
        '<div class="dur">'+fmtDate(it.time)+'</div>' +
        '<div class="date">'+fmtTime(it.time)+'</div>';
      row.addEventListener('click', function(){ play(i); });
      listEl.appendChild(row);
    });
    _rowEls = Array.prototype.slice.call(listEl.querySelectorAll('.row'));
    _lastFocus = -1;
    setFocus(0);
  }

  function doRefresh(){
    updated = false;
    setStatus('正在刷新...');
    var ps = calcNeedCount();
    // APK模式：Java层请求，把条数传过去；浏览器模式：JSONP
    if (window.AndroidBridge) {
      window.AndroidBridge.refresh(ps);
    } else {
      loadAPI();
    }
    setTimeout(function(){
      if (!updated) setStatus(fmtNow() + ' · 离线模式（再选中刷新按钮重试）');
    }, 15000);
  }

  function rows(){ return _rowEls; }
  function setFocus(idx){
    var all = _rowEls;
    if (!all.length) return;
    // focusIdx 同步更新（保证连续按键/列表OK/滚轮累加正确），
    // 仅把 DOM 高亮切换合并到下一帧，避免高频按键触发多次同步重排
    idx = Math.max(0, Math.min(idx, all.length-1));
    focusIdx = idx;
    _pendingFocus = idx;
    if (_focusRaf) return;              // 已有待执行的帧，直接合并本次
    _focusRaf = requestAnimationFrame(function(){
      _focusRaf = 0;
      var target = _pendingFocus;
      _pendingFocus = -1;
      // 不因焦点未变而跳过：进入/退出全屏可能重置scrollTop，从播放返回时必须强制滚动对齐
      if (_lastFocus >= 0 && _lastFocus < _rowEls.length && _lastFocus !== target) _rowEls[_lastFocus].classList.remove('focus');
      if (target < _rowEls.length) _rowEls[target].classList.add('focus');
      _lastFocus = target;
      // 让焦点行滚动到可视区（一次性设置 scrollTop）
      var r = _rowEls[target];
      var container = listEl;
      var cTop = container.scrollTop, cBot = cTop + container.clientHeight;
      var rTop = r.offsetTop, rBot = rTop + r.offsetHeight;
      if (rTop < cTop) container.scrollTop = rTop;
      else if (rBot > cBot) container.scrollTop = rBot - container.clientHeight;
    });
  }

  function play(idx){
    var it = list[idx];
    if (!it || !it.video) return;
    playIdx = idx;  // 记录播放位置，返回时恢复焦点
    watching = true;
    var v = document.getElementById('video');
    v.src = it.video;
    document.getElementById('playerView').classList.add('on');
    v.play().catch(function(){});
    // 触发WebView的onShowCustomView，确保视频画面渲染
    setTimeout(function(){
      try {
        if (v.webkitEnterFullscreen) v.webkitEnterFullscreen();
        else if (v.requestFullscreen) v.requestFullscreen();
      } catch(e){}
    }, 100);
  }

  function exitFs(){
    var fn = document.exitFullscreen || document.webkitExitFullscreen;
    if (fn) { try { fn.call(document); } catch(e){} }
  }

  // 倍速档位：按上/下进入倍速选择（原生居中提示候选），按OK确认才生效；返回/超时取消
  var speeds = [0.25, 0.5, 0.75, 1.0, 1.25, 1.5, 2.0];
  var speedIdx = 3;  // 默认1.0
  var speedPick = false;      // 是否处于倍速选择模式
  var speedPickTimer = null;

  function speedLabel(sp){ return sp.toFixed(2).replace(/0+$/, '').replace(/\.$/, ''); }

  // 只显示候选倍速，不应用（customView全屏时WebView DOM不可见，必须走原生层居中提示）
  function showSpeedDisplay(sp){
    var label = speedLabel(sp);
    if (window.AndroidBridge && window.AndroidBridge.showSpeedPick) {
      window.AndroidBridge.showSpeedPick(label);
    } else if (window.AndroidBridge && window.AndroidBridge.showSpeed) {
      window.AndroidBridge.showSpeed(label);
    } else {
      showSpeedTip(sp);
    }
  }
  function hideSpeedDisplay(){
    if (window.AndroidBridge && window.AndroidBridge.hideSpeedPick) window.AndroidBridge.hideSpeedPick();
  }
  function enterSpeedPick(){
    speedPick = true;
    clearTimeout(speedPickTimer);
    speedPickTimer = setTimeout(function(){ speedPick = false; hideSpeedDisplay(); }, 3000);
  }
  function exitSpeedPick(){
    clearTimeout(speedPickTimer);
    speedPick = false;
    hideSpeedDisplay();
  }
  function moveSpeed(delta){
    speedIdx = (speedIdx + delta + speeds.length) % speeds.length;
    showSpeedDisplay(speeds[speedIdx]);
    clearTimeout(speedPickTimer);
    speedPickTimer = setTimeout(function(){ speedPick = false; hideSpeedDisplay(); }, 3000);
  }

  function applySpeed(sp){
    document.getElementById('video').playbackRate = sp;
    // APK模式：原生层显示确认倍速（customView全屏时webView DOM不可见）
    if (window.AndroidBridge && window.AndroidBridge.showSpeed) {
      window.AndroidBridge.showSpeed(speedLabel(sp));
    } else {
      showSpeedTip(sp);
    }
  }

  // 彻底停止视频并回列表
  window.stopPlayback = function(){
    watching = false;
    exitSpeedPick();   // 停止播放时退出倍速选择
    // APK模式：先通知Kotlin退出全屏（异步）
    if (window.AndroidBridge && window.AndroidBridge.exitFullscreen) {
      window.AndroidBridge.exitFullscreen();
    }
    // 延迟清理DOM，等全屏退出后
    setTimeout(function(){
      var v = document.getElementById('video');
      try { v.pause(); } catch(e){}
      if (v) { v.removeAttribute('src'); try { v.load(); } catch(e){} }
      document.getElementById('playerView').classList.remove('on');
      exitFs();
      if (v && v.parentNode) v.parentNode.removeChild(v);
      var nv = document.createElement('video');
      nv.id = 'video';
      nv.autoplay = true;
      nv.setAttribute('playsinline','');
      nv.controls = true;
      attachVideoEvents(nv);
      var pv = document.getElementById('playerView');
      pv.insertBefore(nv, pv.firstChild);
      speedIdx = 3;
      setFocus(playIdx + 1);
    }, 200);
  };

  // 当贝盒子等WebView：遥控器返回键会触发浏览器后退，用popstate拦截
  history.pushState({page:'list'}, '');
  window.addEventListener('popstate', function(){
    if (watching) {
      window.stopPlayback();
      history.pushState({page:'list'}, '');
    }
  });

  document.addEventListener('keydown', function(e){
    var k = e.keyCode || e.which;
    if (watching) {
      // 上/下：进入倍速选择模式，切换候选并原生提示（OK确认才生效）
      if (k===38 || k===40) {
        if (!speedPick) enterSpeedPick();
        moveSpeed(k===38 ? 1 : -1);
        e.preventDefault(); return;
      }
      // OK/Enter：选择模式中=确认倍速；否则=播放暂停
      if (k===13 || k===23 || k===66) {
        e.preventDefault();
        if (speedPick) { exitSpeedPick(); applySpeed(speeds[speedIdx]); }
        else {
          var v = document.getElementById('video');
          if (v.paused) { v.play(); hideTip(); } else { v.pause(); showTip(); }
        }
        return;
      }
      // 左/右：快退/快进10秒（选择模式中忽略）
      if (!speedPick) {
        if (k===37) { document.getElementById('video').currentTime -= 10; e.preventDefault(); return; }
        if (k===39) { document.getElementById('video').currentTime += 10; e.preventDefault(); return; }
      }
      // 返回/Esc：选择模式中=取消倍速；否则=停止播放回列表
      if (k===27 || k===8 || k===4 || k===111 || k===41 || k===120) {
        e.preventDefault();
        if (speedPick) exitSpeedPick(); else window.stopPlayback();
        return;
      }
      return;
    }
    // 列表页
    var n = rows().length;
    if (!n) return;
    if (k===38) { setFocus(focusIdx-1); e.preventDefault(); }
    else if (k===40) { setFocus(focusIdx+1); e.preventDefault(); }
    else if (k===13 || k===23 || k===66) { if (focusIdx===0) doRefresh(); else play(focusIdx-1); e.preventDefault(); }
  });

  // 鼠标滚轮：上下移动焦点（列表页）
  document.addEventListener('wheel', function(e){
    if (watching) return;
    e.preventDefault();
    if (e.deltaY > 0) setFocus(focusIdx+1);
    else if (e.deltaY < 0) setFocus(focusIdx-1);
  }, {passive:false});

  // 视频通用事件：单击暂停/继续、双击停止回列表、播完自动回列表
  // 初始 video 和 stopPlayback 重建的 video 共用同一份监听，避免重复定义
  function attachVideoEvents(v){
    v.addEventListener('ended', function(){ window.stopPlayback(); });
    v.addEventListener('click', function(){ if (watching) { if (this.paused) { this.play(); hideTip(); } else { this.pause(); showTip(); } } });
    v.addEventListener('dblclick', function(){ if (watching) window.stopPlayback(); });
  }
  attachVideoEvents(document.getElementById('video'));
  // 切后台自动暂停（省电省内存）
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && watching) {
      document.getElementById('video').pause();
    }
  });

  // 退出全屏（按Esc/点原生退出按钮）= 停止播放回列表
  function onFsChange(){
    var isFs = document.fullscreenElement || document.webkitFullscreenElement;
    if (!isFs && watching) {
      window.stopPlayback();
    }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);

  var tipTimer = null;
  function showTip(){
    var t = document.getElementById('centerTip');
    t.textContent = '⏸'; t.style.display='block';
    clearTimeout(tipTimer); tipTimer = setTimeout(function(){ t.style.display='none'; }, 800);
  }
  function showSpeedTip(sp){
    var t = document.getElementById('centerTip');
    t.textContent = sp.toFixed(2) + 'x'; t.style.display='block';
    clearTimeout(tipTimer); tipTimer = setTimeout(function(){ t.style.display='none'; }, 1000);
  }
  function hideTip(){ document.getElementById('centerTip').style.display='none'; }

  function applyList(newList){
    list = newList;
    totalNum.textContent = list.length;
    statusEl.style.display = 'none';
    if (!watching) render();
  }
})();
</script>
</body>
</html>
